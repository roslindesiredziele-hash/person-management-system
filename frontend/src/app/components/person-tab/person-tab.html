<h2>People List</h2>

<table>
    <thead>
        <tr>
            <th>Name</th>
            <th>Surname</th>
            <th>Age</th>
            <th>Pet</th>
        </tr>
    </thead>
    <tbody>
        @for (p of peopleTab(); track p.id) {
        <tr>
            <td>{{ p.name }}</td>
            <td>{{ p.surname }}</td>
            <td>{{ p.age }}</td>
            <td>
                @if (p.pet) {
                {{ p.pet }}
                } @else {
                ---
                }
            </td>
        </tr>
        }
    </tbody>
</table>
