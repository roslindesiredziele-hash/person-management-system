<p>person-tab works!</p>

<table>
  <thead>
    <tr>
      <th>Name</th>
      <th>Surname</th>
      <th>Age</th>
      <th>Pet</th>
    </tr>
  </thead>
  <tbody>
    <tr @for(p of peopleTab)>
      <td>{{ p.name }}</td>
      <td>{{ p.surname }}</td>
      <td>{{ p.age }}</td>
      <td>{{ p.pet }}</td>
    </tr>
  </tbody>
</table>
